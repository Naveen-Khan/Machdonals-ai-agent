```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zodiac AI - Chat with PDF</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>

body{
    background:#020617;
}

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-thumb{
    background:#475569;
    border-radius:10px;
}

.chat-scroll{
    scroll-behavior:smooth;
}

.typing-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#818cf8;
    animation:bounce 1.4s infinite;
}

.typing-dot:nth-child(2){
    animation-delay:.2s;
}

.typing-dot:nth-child(3){
    animation-delay:.4s;
}

@keyframes bounce{
    0%,80%,100%{
        transform:scale(.8);
        opacity:.5;
    }

    40%{
        transform:scale(1.2);
        opacity:1;
    }
}

</style>

</head>

<body class="text-white h-screen">

<div class="h-screen flex">

    <!-- SIDEBAR -->

    <div class="w-80 border-r border-slate-800 bg-slate-950 flex flex-col">

        <div class="p-6 border-b border-slate-800">

            <h1 class="text-2xl font-bold">
                Zodiac <span class="text-indigo-500">AI</span>
            </h1>

            <p class="text-slate-400 text-sm mt-1">
                Chat with your documents
            </p>

        </div>

        <div class="p-4">

            <label class="cursor-pointer">

                <input
                    type="file"
                    id="pdfFile"
                    accept=".pdf"
                    class="hidden">

                <div class="bg-indigo-600 hover:bg-indigo-500 transition p-3 rounded-xl text-center font-medium">

                    <i class="fa-solid fa-file-pdf mr-2"></i>
                    Upload PDF

                </div>

            </label>

        </div>

        <div class="px-4">

            <div class="bg-slate-900 rounded-xl p-4">

                <p class="text-xs uppercase text-indigo-400 mb-2">
                    Current Document
                </p>

                <p id="documentName" class="text-slate-300 text-sm">
                    No PDF uploaded
                </p>

            </div>

        </div>

    </div>

    <!-- CHAT AREA -->

    <div class="flex-1 flex flex-col">

        <!-- HEADER -->

        <div class="h-16 border-b border-slate-800 flex items-center px-6">

            <div>

                <h2 class="font-semibold">
                    AI Document Assistant
                </h2>

                <p class="text-xs text-slate-400">
                    Ask anything about your uploaded PDF
                </p>

            </div>

        </div>

        <!-- CHAT -->

        <div
            id="chatContainer"
            class="flex-1 overflow-y-auto p-6 space-y-4 chat-scroll">

            <div class="flex justify-start">

                <div class="bg-slate-800 px-5 py-3 rounded-2xl max-w-xl">

                    👋 Upload a PDF and start asking questions.

                </div>

            </div>

        </div>

        <!-- INPUT -->

        <div class="border-t border-slate-800 p-4">

            <div class="flex gap-3">

                <input
                    type="text"
                    id="question"
                    placeholder="Ask about your document..."
                    class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-indigo-500">

                <button
                    onclick="sendData()"
                    id="sendBtn"
                    class="bg-indigo-600 hover:bg-indigo-500 px-5 rounded-xl">

                    <i class="fa-solid fa-paper-plane"></i>

                </button>

            </div>

        </div>

    </div>

</div>

<script>

const pdfFile=document.getElementById("pdfFile");

pdfFile.addEventListener("change",()=>{

    if(pdfFile.files.length>0){

        document.getElementById("documentName").innerText=
            pdfFile.files[0].name;

    }

});

function addMessage(message,sender){

    const container=
        document.getElementById("chatContainer");

    const wrapper=
        document.createElement("div");

    wrapper.className=
        sender==="user"
        ? "flex justify-end"
        : "flex justify-start";

    const bubble=
        document.createElement("div");

    bubble.className=
        sender==="user"
        ? "bg-indigo-600 px-5 py-3 rounded-2xl max-w-xl"
        : "bg-slate-800 px-5 py-3 rounded-2xl max-w-xl";

    bubble.innerText=message;

    wrapper.appendChild(bubble);

    container.appendChild(wrapper);

    container.scrollTop=
        container.scrollHeight;

}

function showTyping(){

    const container=
        document.getElementById("chatContainer");

    const wrapper=
        document.createElement("div");

    wrapper.id="typing";

    wrapper.className=
        "flex justify-start";

    wrapper.innerHTML=`

        <div class="bg-slate-800 px-5 py-4 rounded-2xl">

            <div class="flex gap-2">

                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>

            </div>

        </div>

    `;

    container.appendChild(wrapper);

    container.scrollTop=
        container.scrollHeight;

}

function removeTyping(){

    const typing=
        document.getElementById("typing");

    if(typing)
        typing.remove();

}

async function sendData(){

    const file=
        document.getElementById("pdfFile").files[0];

    const question=
        document.getElementById("question").value.trim();

    if(!file){

        alert("Please upload a PDF first.");

        return;

    }

    if(!question){

        return;

    }

    addMessage(question,"user");

    document.getElementById("question").value="";

    showTyping();

    const formData=
        new FormData();

    formData.append("file",file);

    formData.append("chatInput",question);

    try{

        const response=
            await fetch(
              "http://localhost:5678/webhook-test/4001fdcc-8f87-4f77-a59f-b95300e4b191",
                {
                    method:"POST",
                    body:formData
                }
            );

        const data=
            await response.text();

        removeTyping();

        addMessage(
            data || "No response received.",
            "ai"
        );

    }

    catch(error){

        removeTyping();

        addMessage(
            "Error: " + error.message,
            "ai"
        );

    }

}

document
.getElementById("question")
.addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        sendData();

    }

});

</script>

</body>
</html>
